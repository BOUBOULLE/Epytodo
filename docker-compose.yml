services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-epytodo}
    volumes:
      - ./epytodo.sql:/docker-entrypoint-initdb.d/epytodo.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-epytodo}
      MYSQL_HOST: db
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SECRET: ${SECRET:-changeme}
      PORT: ${PORT:-3000}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
